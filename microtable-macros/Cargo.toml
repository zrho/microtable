[package]
name = "microtable-macros"
version = "0.1.0"
edition = "2024"
description = "Attribute macros for microtable"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
darling = "0.23"
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
proc-macro-crate = "3"
